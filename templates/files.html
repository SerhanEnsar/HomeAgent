<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Files - HomeAgent</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: #080c14;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        color: #e2e8f0;
      }

      .container {
        padding: 24px;
        max-width: 1200px;
        margin: 0 auto;
      }

      h1 {
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 20px;
        color: #e2e8f0;
      }

      .device-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }

      .device-card {
        background: #0f1623;
        border: 1px solid #1e2d45;
        border-radius: 14px;
        padding: 16px;
        cursor: pointer;
        transition: 0.15s;
      }

      .device-card:hover {
        background: #1e2d45;
      }

      .device-card .mount {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 6px;
      }

      .device-card .meta {
        font-size: 12px;
        color: #64748b;
      }

      .bar {
        margin-top: 10px;
        height: 4px;
        background: #1e2d45;
        border-radius: 999px;
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #3b82f6, #6366f1);
        border-radius: 999px;
      }

      .explorer {
        background: #0f1623;
        border: 1px solid #1e2d45;
        border-radius: 14px;
        overflow: hidden;
      }

      .explorer-toolbar {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        border-bottom: 1px solid #1e2d45;
      }

      .btn {
        padding: 7px 14px;
        background: #1e2d45;
        border: 1px solid #2a3f5f;
        color: #e2e8f0;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
      }

      .btn:hover {
        background: #2a3f5f;
      }

      .breadcrumb {
        font-size: 13px;
        color: #64748b;
        padding: 0 16px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .file-list {
        list-style: none;
      }

      .file-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        border-top: 1px solid #1e2d45;
        cursor: pointer;
        transition: 0.15s;
      }

      .file-item:hover {
        background: #1e2d45;
      }

      .file-item.selected {
        background: #1e3a5f;
        border-left: 3px solid #3b82f6;
      }

      .file-item .left {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
      }

      .file-item .right {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .file-item .size {
        font-size: 12px;
        color: #64748b;
      }

      .dl-btn {
        padding: 5px 10px;
        background: #1e3a5f;
        border: 1px solid #2a4f7f;
        color: #3b82f6;
        border-radius: 7px;
        cursor: pointer;
        font-size: 12px;
      }

      .dl-btn:hover {
        background: #2a4f7f;
      }

      /* Context menu */
      #ctxMenu {
        position: fixed;
        z-index: 9999;
        display: none;
        background: #0f1623;
        border: 1px solid #1e2d45;
        border-radius: 12px;
        min-width: 180px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }

      .ctx-item {
        padding: 10px 14px;
        cursor: pointer;
        font-size: 13px;
      }

      .ctx-item:hover {
        background: #1e2d45;
      }
      .ctx-delete {
        color: #f87171;
      }

      #previewModal {
        display: none;
      }
      #previewModal.open {
        display: flex;
      }

    </style>
  </head>

  <body>
    {% include "_nav.html" %}

    <div class="container">
      <h1>📁 File Explorer</h1>

      <div id="devices" class="device-grid"></div>
      <div id="explorer" style="display: none"></div>
    </div>

    <div id="ctxMenu">
      <div class="ctx-item" data-act="rename">✏️ Rename</div>
      <div class="ctx-item" data-act="copy">📋 Copy</div>
      <div class="ctx-item" data-act="cut">✂️ Cut</div>
      <div class="ctx-item" data-act="paste">📌 Paste</div>
      <div class="ctx-item ctx-delete" data-act="delete">🗑 Delete</div>
    </div>

    <script>
      let currentMount = null;
      let currentPath = "";
      let ctxTarget = null;
      let clipboard = null;
      let selected = new Set();
      let pressTimer = null;
      let menuJustOpenedUntil = 0;

      function esc(s) {
        return (s || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function formatSize(bytes) {
        if (!bytes) return "";
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / 1048576).toFixed(1) + " MB";
      }

      function fullPath(name) {
        return currentPath ? currentPath + "/" + name : name;
      }

      function hideMenu() {
        document.getElementById("ctxMenu").style.display = "none";
        ctxTarget = null;
      }

      function showMenu(x, y, target) {
        ctxTarget = target;
        // tüm itemları göster
        document.querySelectorAll(".ctx-item").forEach((el) => {
          el.style.display = "block";
        });
        const m = document.getElementById("ctxMenu");
        m.style.left = x + "px";
        m.style.top = y + "px";
        m.style.display = "block";
        menuJustOpenedUntil = Date.now() + 300;
      }

      document.addEventListener("click", () => {
        if (Date.now() < menuJustOpenedUntil) return;
        hideMenu();
      });

      function closePreview() {
        document.getElementById("previewModal").classList.remove("open");
      }

      async function openPreview(name, mount, path) {
        const res = await fetch(
          `/api/files/preview?mount=${encodeURIComponent(mount)}&path=${encodeURIComponent(path)}`,
        );
        const data = await res.json();
        document.getElementById("previewTitle").textContent = name;
        const content = document.getElementById("previewContent");

        if (data.type === "image") {
          const url = `/api/files/download?mount=${encodeURIComponent(mount)}&path=${encodeURIComponent(path)}`;
          content.innerHTML = `<img src="${url}" style="max-width:100%; border-radius:8px;">`;
        } else if (data.type === "text") {
          content.innerHTML = `<pre>${esc(data.content)}</pre>`;
        } else if (data.type === "pdf") {
          const url = `/api/files/download?mount=${encodeURIComponent(mount)}&path=${encodeURIComponent(path)}`;
          window.open(url, "_blank");
          return;
        } else {
          content.innerHTML = `<p style="color:#64748b;">Preview not available for this file type.</p>`;
        }
        document.getElementById("previewModal").classList.add("open");
      }

      async function loadDevices() {
        const res = await fetch("/api/files/devices", { cache: "no-store" });
        const devices = await res.json();
        const container = document.getElementById("devices");
        container.innerHTML = "";

        devices.forEach((d) => {
          if (d.filesystem === "tmpfs") return;
          const pct = parseInt(d.percent);
          const card = document.createElement("div");
          card.className = "device-card";
          card.innerHTML = `
        <div class="mount">💾 ${esc(d.mount)}</div>
        <div class="meta">${d.used} / ${d.size} (${d.percent})</div>
        <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      `;
          card.onclick = () => {
            currentMount = d.mount;
            currentPath = "";
            document.getElementById("devices").style.display = "none";
            document.getElementById("explorer").style.display = "block";
            loadDir();
          };
          container.appendChild(card);
        });
      }

      async function loadDir() {
        selected.clear();
        const res = await fetch(
          `/api/files/list?mount=${encodeURIComponent(currentMount)}&path=${encodeURIComponent(currentPath)}`,
          { cache: "no-store" },
        );
        const data = await res.json();

        const explorer = document.getElementById("explorer");
        let html = `
      <div class="explorer">
        <div class="explorer-toolbar">
          <button class="btn" id="btnBack">⬅ Back</button>
          <button class="btn" id="btnHome">🏠 Devices</button>
          <button class="btn" id="btnUpload">⬆ Upload</button>
          <button class="btn" id="btnMkdir">📁 New Folder</button>
          <input type="file" id="fileInput" style="display:none" multiple>
        </div>
        <div class="breadcrumb" style="padding:10px 16px;">
          ${esc(currentMount)} / ${esc(currentPath)}
        </div>
        <ul class="file-list">
    `;

        data.items.forEach((it) => {
          const icon = it.type === "dir" ? "📁" : "📄";
          const dlBtn =
            it.type === "file"
              ? `<button class="dl-btn" data-name="${esc(it.name)}">⬇</button>`
              : "";

          html += `
        <li class="file-item" data-name="${esc(it.name)}" data-type="${it.type}">
          <div class="left">${icon} ${esc(it.name)}</div>
          <div class="right">
            <span class="size">${formatSize(it.size)}</span>
            ${dlBtn}
          </div>
        </li>
      `;
        });

        html += `</ul></div>`;
        explorer.innerHTML = html;

        document.getElementById("btnHome").onclick = () => {
          currentMount = null;
          currentPath = "";
          document.getElementById("explorer").style.display = "none";
          document.getElementById("devices").style.display = "grid";
        };

        document.getElementById("btnUpload").onclick = () => {
          document.getElementById("fileInput").click();
        };

        document.getElementById("btnMkdir").onclick = async () => {
          const name = prompt("Folder name:");
          if (!name) return;
          await fetch("/api/files/mkdir", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              mount: currentMount,
              path: currentPath,
              name: name,
            }),
          });
          loadDir();
        };

        document.getElementById("fileInput").onchange = async (e) => {
          const files = e.target.files;
          for (const file of files) {
            const formData = new FormData();
            formData.append("mount", currentMount);
            formData.append("path", currentPath);
            formData.append("file", file);
            await fetch("/api/files/upload", {
              method: "POST",
              body: formData,
            });
          }
          loadDir();
        };

        document.getElementById("btnBack").onclick = () => {
          if (!currentPath) return;
          const parts = currentPath.split("/");
          parts.pop();
          currentPath = parts.join("/");
          loadDir();
        };

        document.querySelectorAll(".file-item").forEach((li) => {
          li.onclick = (e) => {
            if (e.target.classList.contains("dl-btn")) return;
            if (e.ctrlKey || e.metaKey) {
              if (selected.has(li.dataset.name)) {
                selected.delete(li.dataset.name);
                li.classList.remove("selected");
              } else {
                selected.add(li.dataset.name);
                li.classList.add("selected");
              }
              return;
            }
            if (li.dataset.type === "dir") {
              currentPath = fullPath(li.dataset.name);
              loadDir();
            } else {
              openPreview(
                li.dataset.name,
                currentMount,
                fullPath(li.dataset.name),
              );
            }
          };
        });

        document.querySelectorAll(".dl-btn").forEach((btn) => {
          btn.onclick = (e) => {
            e.stopPropagation();
            const name = btn.dataset.name;
            const path = fullPath(name);
            window.location.href = `/api/files/download?mount=${encodeURIComponent(currentMount)}&path=${encodeURIComponent(path)}`;
          };
        });

        document
          .getElementById("explorer")
          .addEventListener("contextmenu", (e) => {
            if (e.target.closest(".file-item")) return; // dosya üzerindeyse normal menu açılsın
            e.preventDefault();
            if (!clipboard) return; // clipboard boşsa menü açma
            ctxTarget = null;
            showMenu(e.clientX, e.clientY, null);
            // sadece paste görünsün
            document.querySelectorAll(".ctx-item").forEach((el) => {
              el.style.display = el.dataset.act === "paste" ? "block" : "none";
            });
          });

        document.querySelectorAll(".file-item").forEach((li) => {
          li.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            showMenu(e.clientX, e.clientY, {
              name: li.dataset.name,
              type: li.dataset.type,
              fullPath: fullPath(li.dataset.name),
            });
          });

          li.addEventListener("pointerdown", (e) => {
            if (e.pointerType !== "touch") return;
            pressTimer = setTimeout(() => {
              showMenu(e.clientX, e.clientY, {
                name: li.dataset.name,
                type: li.dataset.type,
                fullPath: fullPath(li.dataset.name),
              });
            }, 550);
          });

          li.addEventListener("pointerup", () => clearTimeout(pressTimer));
          li.addEventListener("pointermove", () => clearTimeout(pressTimer));
        });
      }

      document.querySelectorAll(".ctx-item").forEach((el) => {
        el.onclick = async () => {
          if (!ctxTarget && el.dataset.act !== "paste") return;

          if (el.dataset.act === "rename") {
            const n = prompt("New name:", ctxTarget.name);
            if (!n) return;
            await fetch("/api/files/rename", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                mount: currentMount,
                path: ctxTarget.fullPath,
                new_name: n,
              }),
            });
            loadDir();
          }

          if (el.dataset.act === "copy") {
            const items =
              selected.size > 0
                ? Array.from(selected).map((name) => fullPath(name))
                : [ctxTarget.fullPath];
            clipboard = { type: "copy", mount: currentMount, items };
            hideMenu();
            return;
          }

          if (el.dataset.act === "cut") {
            const items =
              selected.size > 0
                ? Array.from(selected).map((name) => fullPath(name))
                : [ctxTarget.fullPath];
            clipboard = { type: "cut", mount: currentMount, items };
            hideMenu();
            return;
          }

          if (el.dataset.act === "paste") {
            if (!clipboard) return;
            for (const src of clipboard.items) {
              const name = src.split("/").pop();
              const dst = fullPath(name);
              if (clipboard.type === "copy") {
                await fetch("/api/files/copy", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ mount: currentMount, src, dst }),
                });
              } else {
                await fetch("/api/files/move", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ mount: currentMount, src, dst }),
                });
              }
            }
            if (clipboard.type === "cut") clipboard = null;
            loadDir();
            hideMenu();
            return;
          }

          if (el.dataset.act === "delete") {
            const items =
              selected.size > 0
                ? Array.from(selected).map((name) => fullPath(name))
                : [ctxTarget.fullPath];

            if (!confirm(`Move ${items.length} item(s) to trash?`)) return;

            for (const path of items) {
              await fetch("/api/files/trash", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mount: currentMount, path }),
              });
            }
            selected.clear();
            loadDir();
          }

          hideMenu();
        };
      });

      loadDevices();
    </script>

    <!-- Preview Modal -->
    <div
      id="previewModal"
      style="
        position: fixed;
        inset: 0;
        z-index: 9998;
        background: rgba(0, 0, 0, 0.8);
        align-items: center;
        justify-content: center;
        padding: 24px;
      "
    >
      <div
        style="
          background: #0f1623;
          border: 1px solid #1e2d45;
          border-radius: 16px;
          max-width: 900px;
          width: 100%;
          max-height: 90vh;
          overflow: hidden;
          display: flex;
          flex-direction: column;
        "
      >
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid #1e2d45;
          "
        >
          <span
            id="previewTitle"
            style="font-weight: 700; font-size: 14px"
          ></span>
          <button class="btn" onclick="closePreview()">✕ Close</button>
        </div>
        <div
          id="previewContent"
          style="overflow: auto; padding: 16px; flex: 1"
        ></div>
      </div>
    </div>
  </body>
</html>
