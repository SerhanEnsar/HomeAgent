<style>
  .navbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #0f1623;
    border-bottom: 1px solid #1e2d45;
    position: sticky;
    top: 0;
    z-index: 999;
  }

  .navbar a {
    color: #94a3b8;
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    transition: .15s;
  }

  .navbar a:hover { background: #1e2d45; color: #e2e8f0; }
  .navbar a.active { background: #1e3a5f; color: #3b82f6; }
  .navbar a.logout { margin-left: auto; color: #f87171; }
  .navbar a.logout:hover { background: rgba(239,68,68,.1); }
</style>

<nav class="navbar">
  <a href="/" class="{{ 'active' if active_page == 'dashboard' else '' }}">🏠 Dashboard</a>
  <a href="/files" class="{{ 'active' if active_page == 'files' else '' }}">📁 Files</a>
  <a href="/trash" class="{{ 'active' if active_page == 'trash' else '' }}">🗑 Trash</a>
  <a href="/logout" class="logout">Çıkış</a>
</nav>
