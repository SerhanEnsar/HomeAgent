<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeAgent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080c14;
      font-family: system-ui, -apple-system, sans-serif;
      color: #e2e8f0;
    }

    .card {
      width: min(400px, 92vw);
      background: #0f1623;
      border: 1px solid #1e2d45;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,.5);
    }

    .hero {
      padding: 28px 28px 20px;
      border-bottom: 1px solid #1e2d45;
      background: linear-gradient(135deg, #0f1623 0%, #111e30 100%);
    }

    .logo {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 24px;
      margin-bottom: 14px;
    }

    .hero h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    .hero p {
      margin-top: 4px;
      font-size: 13px;
      color: #64748b;
    }

    .body {
      padding: 24px 28px 28px;
    }

    .error {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      color: #f87171;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      background: #080c14;
      border: 1px solid #1e2d45;
      border-radius: 12px;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,.15);
    }

    button {
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s;
    }

    button:hover { opacity: .9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="hero">
      <div class="logo">🏠</div>
      <h1>HomeAgent</h1>
      <p>Yerel ağ cihaz yönetim paneli</p>
    </div>

    <div class="body">
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login">
        <div class="field">
          <label>Kullanıcı Adı</label>
          <input name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label>Şifre</label>
          <input type="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit">Giriş Yap</button>
      </form>
    </div>
  </div>
</body>
</html>
